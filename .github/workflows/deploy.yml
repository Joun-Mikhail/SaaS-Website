name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish the current main by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Pages has never been switched on for this repo; let the first run do it.
          enablement: true

      - run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build
        # Pages serves a project site from /<repo>/, so the build needs to know
        # both the origin and the subpath. Both come from the Pages config, so
        # pointing a custom domain at the repo needs no change here.
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
