name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Content files are hand-edited by shop staff; a bad price, a category
      # typo or a missing photo should fail here, not on the live site.
      - name: Validate content files
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
